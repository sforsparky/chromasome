<!doctype html>
<!--
  Source for public/og-image.png (1200 × 630, the Open Graph / Twitter card image).
  To re-render: open this file in Chrome at exactly 1200 × 630 and screenshot it,
  or run a headless browser screenshot of this page at that viewport size.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=JetBrains+Mono:wght@700&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        display: flex;
        background: #0f0f10;
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .brand {
        flex: 0 0 580px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 64px 48px 56px 64px;
        color: #f4f4f5;
      }

      .mark {
        width: 72px;
        height: 72px;
      }

      .name {
        margin-top: auto;
        font-weight: 800;
        font-size: 70px;
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .what {
        margin-top: 18px;
        font-weight: 500;
        font-size: 30px;
        color: #a1a1aa;
        letter-spacing: -0.01em;
      }

      .host {
        margin-top: auto;
        font-weight: 500;
        font-size: 22px;
        color: #71717a;
      }

      .strand {
        flex: 1;
        display: flex;
      }

      .band {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 48px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <section class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#1c1c1f" />
        <g fill="none" stroke-width="5" stroke-linecap="round">
          <path d="M20 10c0 14 24 14 24 22s-24 8-24 22" stroke="#2a9d8f" />
          <path d="M44 10c0 14-24 14-24 22s24 8 24 22" stroke="#e9c46a" />
          <path d="M24 20h16" stroke="#f4a261" />
          <path d="M26 32h12" stroke="#e76f51" />
          <path d="M24 44h16" stroke="#f4a261" />
        </g>
      </svg>
      <h1 class="name">Chromasome</h1>
      <p class="what">Color palette generator</p>
      <p class="host">inmydna.com</p>
    </section>

    <section class="strand" aria-label="Sample palette">
      <div class="band" style="background: #264653; color: #ffffff">264653</div>
      <div class="band" style="background: #2a9d8f; color: #111111">2A9D8F</div>
      <div class="band" style="background: #e9c46a; color: #111111">E9C46A</div>
      <div class="band" style="background: #f4a261; color: #111111">F4A261</div>
      <div class="band" style="background: #e76f51; color: #111111">E76F51</div>
    </section>
  </body>
</html>
